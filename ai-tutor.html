<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>AI Tutor | LearnX</title><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"><script src="js/main.js"></script><script src="js/tutor.js"></script></head>
<body data-protected="1"><div class="app"><aside class="sidebar" id="sidebar"></aside>
<main class="main"><header class="topbar" id="topbar" data-title="LearnX AI Tutor" data-sub="Ask anything. Learn everything."></header>
 <div class="head-actions"><button class="btn" id="newBtn">New Chat</button><button class="btn" id="clearBtn">Clear Chat</button></div>
 <section class="card chat"><div class="messages" id="messages" aria-live="polite"></div>
  <div class="suggest"><button class="chip">Explain Binary Search</button><button class="chip">Create notes on Operating Systems</button><button class="chip">Explain DBMS normalization</button><button class="chip">Give me Java interview questions</button><button class="chip">Explain this topic in simple language</button></div>
  <div class="composer"><input class="input" id="chatInput" placeholder="Ask LearnX anything..." aria-label="Message"><button class="btn btn-primary" id="sendBtn">Send</button></div></section>
</main></div></body></html>
