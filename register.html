<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>Create Account | LearnX</title><script src="js/main.js"></script><script src="js/auth.js"></script></head>
<body><main class="auth"><section class="card auth-card">
 <a class="logo" href="index.html"><b>L</b>LearnX</a><h1>Create your account</h1><p class="muted">Tell us your goal and we will personalize your plan.</p>
 <form id="authForm" data-mode="register" novalidate>
  <div class="field"><label for="name">Full Name</label><input class="input" id="name" name="name" autocomplete="name"><p class="msg"></p></div>
  <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email"><p class="msg"></p></div>
  <div class="field"><label for="password">Password</label><div class="pw"><input class="input" id="password" name="password" type="password" autocomplete="new-password"><button type="button">Show</button></div><div class="strength"><i></i></div><p class="msg"></p></div>
  <div class="field"><label for="confirm">Confirm Password</label><div class="pw"><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password"><button type="button">Show</button></div><p class="msg"></p></div>
  <div class="field"><label for="goal">Learning Goal</label><input class="input" id="goal" name="goal" placeholder="e.g. Crack coding interviews"><p class="msg"></p></div>
  <div class="field"><label for="level">Current Knowledge Level</label><select class="input" id="level" name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><p class="msg"></p></div>
  <div class="field"><label><input type="checkbox" name="terms"> I agree to the Terms and Privacy Policy</label><p class="msg"></p></div>
  <button class="btn btn-primary" type="submit">Create Account</button>
 </form>
 <p class="center">Already registered? <a href="login.html">Login</a></p>
</section></main></body></html>
